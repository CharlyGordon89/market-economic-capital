[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-ec"
version = "0.1.0"
description = "Market Risk Economic Capital toolkit (education/portfolio project)"
authors = [{name = "Ruslan Mamedov"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "mlflow>=2.13",
  "pyyaml>=6.0",
  "yfinance>=0.2.52",
  "pyarrow>=16.0",
  "polars>=1.5.0",
  "pydantic>=2.8.0",
  "tqdm>=4.66",
  "python-dateutil>=2.9",
  "arch>=6.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "mypy>=1.10",
]

[tool.ruff]
line-length = 100
select = ["E","F","I","B","UP","N"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
markers = [
  "integration: tests that hit external services like Yahoo Finance"
]


[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[project.scripts]
market-ec = "market_ec.cli:main"
